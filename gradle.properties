# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with the configuration cache
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.5
# Farmer's Delight (refabricated) ships a `classTweaker v2` access widener which
# requires this Loom line. It declares `org.gradle.jvm.version=25`, so the Gradle
# daemon has to run on Java 25 (see gradle/gradle-daemon-jvm.properties); the mod
# itself is still compiled for Java 21.
loom_version=1.18-SNAPSHOT

# Mod Properties
mod_id=twilightsparksdelightfabric
mod_name=Twilight Spark's Delight Fabric
mod_description=A Farmer's Delight style food expansion for The Twilight Forest.
mod_authors=FromtheArakiel
mod_license=TWILIGHTSPARKDELIGHTFABRIC LICENSE v3.0
mod_version=1.0.0
maven_group=dev.arakiel.twilightsparksdelightfabric

# Dependencies
fabric_api_version=0.116.17+1.21.1
